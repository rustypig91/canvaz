[package]
name = "canvaz"
version = "0.6.3"
description = "Rusty's Canvaz - CAN Analyzer: view, decode, plot, and simulate CAN bus traffic"
authors = ["Christoffer Zakrisson"]
edition = "2021"

[lib]
name = "canvaz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
can-dbc = "9"
socketcan = { version = "3", optional = true }
libloading = { version = "0.8", optional = true }
thiserror = "1"
log = "0.4"
sysinfo = "0.37"
ureq = "3"
sha2 = "0.10"
tempfile = "3"
url = "2"
percent-encoding = "2"

# Platform defaults: on each target these crates are non-optional, and the
# backend cfg() gates accept target_os = "linux" as well, so a plain build gets
# Kvaser + PCAN everywhere (default features) and SocketCAN on Linux without
# any --features flag. The linux-can feature only forces SocketCAN on for
# other targets.
[target.'cfg(windows)'.dependencies]
libloading = { version = "0.8" }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3" }

[features]
default = ["kvaser", "pcan"]
kvaser = ["dep:libloading"]
pcan = ["dep:libloading"]
linux-can = ["dep:socketcan"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
