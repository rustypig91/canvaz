name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_VERSION="$(grep -m1 '^version *= *"' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Tag version:        $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi

  build:
    needs: verify-version
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build.yml

  store:
    needs: verify-version
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/store.yml

  publish-privacy-policy:
    needs: [build, store]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/privacy-policy.yml

  # Default success() gating also blocks releases on failed, cancelled, or skipped jobs.
  release:
    needs: [build, store, publish-privacy-policy]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux release assets
        uses: actions/download-artifact@v8
        with:
          name: canvaz-ubuntu-22.04-build-${{ github.run_id }}
          path: release-assets

      - name: Download Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: canvaz-windows-latest-build-${{ github.run_id }}
          path: release-assets

      - name: Download Store submission archive
        uses: actions/download-artifact@v8
        with:
          name: canvaz-store-submission-${{ github.run_id }}
          path: release-assets

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Rusty's Canvaz - CAN Analyzer ${{ github.ref_name }}"
          body: |
            See the assets to download this version and install.

            `store-submission.zip` contains the unsigned Microsoft Store submission
            package and listing materials for maintainers. Use the EXE/MSI assets
            for direct Windows installation.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/**/*

  publish-apt:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Request shared APT reconciliation
        env:
          GH_TOKEN: ${{ secrets.APT_PUBLISH_TOKEN }}
        run: gh api --method POST repos/rustypig91/rusty-apt/actions/workflows/publish-apt.yml/dispatches -f ref=main
