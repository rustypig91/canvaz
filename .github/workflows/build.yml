name: "build"

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # PR commits replace older builds; every other run has its own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xauth xdotool imagemagick

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm" # Set this to npm, yarn or pnpm.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: npm install # change this to npm or pnpm depending on which one you use.

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On a tag build, pin the in-app version to the tag so it isn't marked
          # "-modified" when the CI build step dirties the working tree. Empty on
          # non-tag builds, where build.rs falls back to `git describe`.
          CANVAZ_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        with:
          args: ${{ matrix.args }}

      - name: Stage release bundles with canonical filenames
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const artifacts = JSON.parse(process.env.ARTIFACT_PATHS);
          if (!artifacts.length) throw new Error('No release bundles were produced');
          fs.mkdirSync('release-assets', { recursive: true });
          for (const artifact of artifacts) {
            const original = path.basename(artifact);
            // Preserve suffixes used by already-installed versions' updater.
            const version = original.match(/\d+\.\d+\.\d+.*$/);
            if (!version) throw new Error(`Missing version in bundle: ${original}`);
            const name = original.startsWith('canvaz_') ? original : `canvaz_${version[0]}`;
            console.log(`${original} -> ${name}`);
            fs.copyFileSync(artifact, path.join('release-assets', name), fs.constants.COPYFILE_EXCL);
          }
          JS

      - name: Prepare canonical Debian package
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb')
          test "${#packages[@]}" = 1
          bash packaging/debian.sh "${packages[0]}"

      - name: Stage canonical Debian package
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: cp apt-assets/*.deb release-assets/

      # Stage all installable packages before compiling the demo variant.
      # Never bundle or distribute the demo binary.
      - name: Build screenshot demo (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          CANVAZ_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: npm run tauri -- build --no-bundle --features demo

      - name: Capture screenshot (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/capture-screenshot.sh src-tauri/target/release/canvaz screenshot/canvaz-screenshot.png

      - name: Stage screenshot (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: cp screenshot/canvaz-screenshot.png release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: canvaz-${{ matrix.platform }}-build-${{ github.run_id }}
          # Retain successful platforms' artifacts when rerunning a failed job.
          overwrite: true
          if-no-files-found: error
          path: release-assets/*
